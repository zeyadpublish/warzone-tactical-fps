workflows:
  android-debug:
    name: Android APK (Debug)
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Install Node.js 20
        script: |
          brew install node@20 2>/dev/null || true
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          node --version && npm --version

      - name: Install dependencies & build web
        script: |
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          npm ci
          # Build with ./ base (NOT GitHub Pages base) for Android WebView
          npm run build

      - name: Sync Capacitor (copy dist → android assets)
        script: |
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          npm install -g @capacitor/cli
          # Force sync - copies dist/ into android/app/src/main/assets/public/
          npx cap sync android --no-build
          echo "✅ Capacitor sync done"
          # Verify the files were copied
          ls android/app/src/main/assets/public/ | head -10

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

    artifacts:
      - "android/**/*.apk"

    publishing:
      email:
        recipients:
          - z6639460@gmail.com
        notify:
          success: true
          failure: true
