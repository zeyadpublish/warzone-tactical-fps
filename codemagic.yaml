workflows:
  android-debug:
    name: Android APK (Debug — No Keystore Needed)
    max_build_duration: 60
    environment:
      node: 20.x
      java: 17
    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web app with Vite
        script: npm run build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - z6639460@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android APK (Signed Release)
    max_build_duration: 60
    environment:
      node: 20.x
      java: 17
      # Uncomment below ONLY after you upload a keystore in Codemagic Settings → Code signing
      # android_signing:
      #   - warzone_keystore
    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web app with Vite
        script: npm run build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/app-release-unsigned.apk

    publishing:
      email:
        recipients:
          - z6639460@gmail.com
        notify:
          success: true
          failure: true

  windows-exe:
    name: Windows EXE Build
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      node: 20.x
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Build Windows EXE
        script: npm run electron:build

    artifacts:
      - release/*.exe
      - release/*.msi
