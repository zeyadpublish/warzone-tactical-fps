workflows:
  android-release:
    name: Android APK Release
    max_build_duration: 60
    environment:
      node: 20.x
      java: 17
      android_signing:
        - warzone_keystore
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        script: |
          jarsigner -verbose \
            -keystore $CM_KEYSTORE_PATH \
            -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD \
            -signedjar android/app/build/outputs/apk/release/warzone-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            $CM_KEY_ALIAS

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - zeyad@warzone.game
        notify:
          success: true
          failure: true

  windows-exe:
    name: Windows EXE Build
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      node: 20.x
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Build Windows EXE
        script: npm run electron:build

    artifacts:
      - release/*.exe
      - release/*.msi
