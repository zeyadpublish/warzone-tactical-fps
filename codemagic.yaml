workflows:
  android-debug:
    name: Android APK (Debug — No Keystore Needed)
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install Node.js 20 via Homebrew
        script: |
          brew install node@20 || brew upgrade node@20 || true
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          echo 'export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"' >> ~/.zshrc
          node --version
          npm --version

      - name: Install Node dependencies
        script: |
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          npm ci

      - name: Build web app with Vite
        script: |
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          npm run build

      - name: Install Capacitor CLI
        script: |
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          npm install -g @capacitor/cli

      - name: Add Android platform if missing
        script: |
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        script: |
          export PATH="/opt/homebrew/opt/node@20/bin:/usr/local/opt/node@20/bin:$PATH"
          npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - z6639460@gmail.com
        notify:
          success: true
          failure: true
