workflows:
  android-debug:
    name: Android APK (Debug — No Keystore Needed)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set up Node.js 20
        script: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install Node dependencies
        script: npm ci

      - name: Build web app with Vite
        script: npm run build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - z6639460@gmail.com
        notify:
          success: true
          failure: true

  windows-exe:
    name: Windows EXE Build
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      java: 17
    scripts:
      - name: Set up Node.js
        script: |
          nvm install 20.14.0
          nvm use 20.14.0

      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Build Windows EXE
        script: npm run electron:build

    artifacts:
      - release/*.exe
      - release/*.msi
